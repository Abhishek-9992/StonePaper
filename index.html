<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>https://RPS.in</title>
    <style>
        body{
            background-color: rgb(25,25,25);
            color: azure;
            text-transform: capitalize;
            text-align: center;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        .butt{
            border-radius: 70%;
            background-color: rgb(25,25,25);
            border: 2px solid white;
            padding: 30px;
            font-size: 50px;
            margin: 10px;
            cursor: pointer;
            
        }
        .butt:hover{
            scale: 1.1;
        }
        .js-result{
            font-size: 25px;
            font-weight: bold;
            color: rgb(20, 196, 255);
        }
        .js-score{
            font-size: 20px;
           
            font-weight: 500;
        }
        .resest{
            padding: 10px 20px;
            border-radius: 15px;
            font-size: 17px;
            font-weight: 549;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        .resest:hover{
            background-color: bisque;
            scale:1.05;
        }
       
    </style>
    
        
</head>
<body>
    <h1>Rock Paper Scissor</h1>
    <br>
    <button class="butt" onclick="
             playGame('rock');
    ">✊</button>
    <button class="butt" onclick="
            playGame('paper');
    ">🖐️</button>
    <button class="butt" onclick="
            playGame('scissor');
    ">✌️</button>
    <p class="js-result"></p>
    <p class="js-moves"></p>
    <p class="js-score"></p>
    <button class="resest" onclick="
    score.wins=0;
    score.loses=0;
    score.ties=0;
    localStorage.removeItem('score');
    document.querySelector('.js-result').innerHTML='';
    document.querySelector('.js-moves').innerHTML='';
    updateScoreElement();
    

    ">Reset Score</button><br>
    <button class="resest" onclick="
        autoplay();
    ">AutoPlay</button>
    <script>
        let score=
            JSON.parse(localStorage.getItem('score')) || {wins:0,
                    loses:0,
                    ties:0,};
           updateScoreElement();
           document.body.addEventListener('keydown',(event)=>{
            if(event.key==='r'){
                playGame('rock');
            }
            else if(event.key==='p'){
                playGame('paper');
            }
            else if(event.key==='s'){
                playGame('scissor');
            }
        });
        //console.log(JSON.parse(localStorage.getItem('score')))
        let isAutoplaying=false;
        let intervalId;
        function autoplay(){
            if(!isAutoplaying){
                intervalId=setInterval(function(){
                const playerMove=pickComputerMove();
                playGame(playerMove);
            },1000);
            isAutoplaying=true;
            }
            else{
                clearInterval(intervalId);
                isAutoplaying=false;
            }
           
            
        }
        function playGame(playerMove){
            const computerMove=pickComputerMove();
            let result='';
            if(playerMove==='scissor'){
                    if(computerMove==='rock'){
                    result='you lose';
                     }
                    else if(computerMove==='paper'){
                        result='you win';
                    }
                    else{
                        result='tie';
                    }
            }
            else if(playerMove==='paper'){

                    if(computerMove==='rock'){
                        result='you win';
                    }
                    else if(computerMove==='paper'){
                        result='tie';
                    }
                    else{
                        result='you lose';
                    }
            }
            else{
                    if(computerMove==='rock'){
                        result='tie';
                    }
                    else if(computerMove==='paper'){
                        result='you lose';
                    }
                    else{
                        result='you win';
                    }
            } 
            //to store result
            if(result==='you win'){
                score.wins++;
            }
            else if(result==='you lose'){
                score.loses++;
            }
            else if(result==='tie'){
                score.ties++;
            }

            localStorage.setItem('score',JSON.stringify(score));

           updateScoreElement();
           let moveYour;
           let MoveComp;
           document.querySelector('.js-result').innerHTML=result;
           if(playerMove==='rock'){
                moveYour='✊';
           }
           else if(playerMove==='paper'){
                moveYour='🖐️';
           }
           else if(playerMove==='scissor'){
                moveYour='✌️';
           }
           if(computerMove==='rock'){
            MoveComp='✊';
           }
           else if(computerMove==='paper'){
            MoveComp='🖐️';
           }
           else if(computerMove==='scissor'){
            MoveComp='✌️';
           }
              
           document.querySelector('.js-moves').innerHTML=`You picked : ${moveYour}. Computer picked :  ${MoveComp}.`;

           
        }
        function updateScoreElement(){
            document.querySelector('.js-score').innerHTML=
           `Wins : ${score.wins} , Loses : ${score.loses} , Ties:  ${score.ties} .`
        }
        function pickComputerMove(){
            const randomNumber=Math.random();
            let computerMove='';
                if(randomNumber>=0 && randomNumber<1/3){
                    computerMove='rock';
                }
                else if(randomNumber>=1/3 && randomNumber<2/3){
                    computerMove='paper';
                }
                else{
                    computerMove='scissor';
                }
            return computerMove;
        }
    </script>
</body>
</html>
